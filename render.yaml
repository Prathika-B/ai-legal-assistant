services:
  - type: web
    name: ai-legal-assistant
    env: python
    buildCommand: "npm --prefix frontend/web_app install && npm --prefix frontend/web_app run build && pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
